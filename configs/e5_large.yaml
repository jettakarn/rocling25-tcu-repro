seed: 42
encoder_name: intfloat/multilingual-e5-large
use_instruct: false
embed_prefix: "query: "
batch_size: 16
max_length: 512
device: cuda

svr:
  kernel: rbf
  C: 10.0
  epsilon: 0.2

data:
  train_path: data/processed/train.csv
  dev_path: data/processed/dev.csv
  test_path: data/processed/test.csv
  embeddings_dir: data/embeddings
  results_dir: results
